<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Joke Calendar">
<title>Christmas Joke Advent Calendar</title>
<link href="https://fonts.googleapis.com/css?family=Mountains+of+Christmas:700|Fredoka+One&display=swap" rel="stylesheet">
<style>
  /* Written for older iPads too: no CSS variables, grid, gap, inset or aspect-ratio. */
  * { -webkit-box-sizing: border-box; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Fredoka One', 'Trebuchet MS', Arial, sans-serif;
    color: #fff8ec;
    background-color: #0f1f3d;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }
  #bg {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
    background: #0f1f3d url(img/background.jpg) center center no-repeat;
    -webkit-background-size: cover; background-size: cover;
  }
  #bg:after {
    content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: -webkit-linear-gradient(top, rgba(8,16,40,.55), rgba(8,16,40,.15) 45%, rgba(8,16,40,.45));
    background: linear-gradient(to bottom, rgba(8,16,40,.55), rgba(8,16,40,.15) 45%, rgba(8,16,40,.45));
  }
  #snow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .wrap { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 24px 14px 50px; }
  header { text-align: center; margin-bottom: 20px; }
  h1 {
    font-family: 'Mountains of Christmas', Georgia, serif;
    font-size: 44px; line-height: 1.05; margin: 0; color: #f5c542;
    text-shadow: 0 3px 0 #8f1d25, 0 6px 16px rgba(0,0,0,.4);
  }
  @media (min-width: 600px) { h1 { font-size: 64px; } }
  .sub { font-size: 18px; margin: 10px 0 0; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  .status {
    display: inline-block; margin-top: 14px; padding: 8px 18px; border-radius: 30px;
    background: rgba(10,20,45,.7); border: 1px solid rgba(255,255,255,.3);
  }

  .board {
    background: rgba(19,87,58,.6);
    padding: 8px; border-radius: 22px; border: 6px solid #c8323c;
    box-shadow: 0 0 0 4px #f5c542, 0 18px 40px rgba(0,0,0,.45);
  }
  .board:after { content: ""; display: block; clear: both; }
  .cell { float: left; width: 25%; padding: 5px; }
  @media (min-width: 640px) { .cell { width: 16.6666%; padding: 6px; } }

  .door {
    position: relative; display: block; width: 100%; height: 0; padding: 0 0 112% 0;
    border: 0; margin: 0; cursor: pointer; border-radius: 12px; background: #0b3b25;
    font-family: inherit; -webkit-appearance: none; -webkit-tap-highlight-color: transparent;
    -webkit-perspective: 600px; perspective: 600px;
  }
  .inside, .front {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 12px;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
  }
  .inside { background: #fff8ec; font-size: 34px; }
  .front {
    color: #fff8ec; border: 2px dashed rgba(255,255,255,.35);
    -webkit-transform-origin: left center; transform-origin: left center;
    -webkit-transition: -webkit-transform .7s ease; transition: transform .7s ease;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
  }
  .c0 .front { background: #fbe7c6; background-image: -webkit-radial-gradient(center, circle, #fff8ec, #f2d39c); background-image: radial-gradient(circle, #fff8ec, #f2d39c); }
  .c1 .front { background: #cfe8f7; background-image: -webkit-radial-gradient(center, circle, #f2fbff, #9fcbe8); background-image: radial-gradient(circle, #f2fbff, #9fcbe8); }
  .c2 .front { background: #d9efd9; background-image: -webkit-radial-gradient(center, circle, #f4fff2, #a9d7a6); background-image: radial-gradient(circle, #f4fff2, #a9d7a6); }
  .front { border: 3px solid #c8323c; }
  .pic {
    position: absolute; left: 6%; right: 4%; top: 10%; bottom: 3%;
    background-repeat: no-repeat; background-position: center bottom;
    -webkit-background-size: contain; background-size: contain;
  }
  .front .num {
    position: absolute; top: 3px; left: 3px; z-index: 2;
    font-family: 'Fredoka One', 'Arial Rounded MT Bold', Arial, sans-serif; font-weight: bold;
    font-size: 24px; min-width: 40px; height: 40px; line-height: 35px; padding: 0 5px; text-align: center;
    color: #7a1018; background: #f5c542; border: 3px solid #7a1018; border-radius: 20px;
    text-shadow: none; box-shadow: 0 0 0 2px #fff, 0 3px 6px rgba(0,0,0,.5);
  }
  .front .tag { position: absolute; bottom: 3px; right: 6px; z-index: 2; font-size: 14px; }
  .num { font-family: 'Mountains of Christmas', Georgia, serif; font-size: 36px; line-height: 1; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .tag { font-size: 11px; letter-spacing: 1px; margin-top: 2px; }
  @media (min-width: 640px) { .front .num { font-size: 30px; min-width: 50px; height: 50px; line-height: 44px; border-radius: 25px; } .inside { font-size: 40px; } }
  .locked .pic { opacity: .55; }
  .today .front { box-shadow: 0 0 0 3px #f5c542, 0 0 20px #f5c542; -webkit-animation: pulse 1.6s ease-in-out infinite; animation: pulse 1.6s ease-in-out infinite; }
  .opened .front { -webkit-transform: rotateY(-105deg); transform: rotateY(-105deg); }
  .shake { -webkit-animation: shake .45s; animation: shake .45s; }
  @-webkit-keyframes pulse { 50% { -webkit-transform: scale(1.05); } }
  @keyframes pulse { 50% { transform: scale(1.05); } }
  @-webkit-keyframes shake { 25%,75% { -webkit-transform: translateX(-5px); } 50% { -webkit-transform: translateX(5px); } }
  @keyframes shake { 25%,75% { transform: translateX(-5px); } 50% { transform: translateX(5px); } }

  .overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: none;
    background: rgba(5,12,28,.75); padding: 18px; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .overlay.show { display: block; }
  .card {
    position: relative; background: #fff8ec; color: #2b1a12; max-width: 460px; margin: 8vh auto 0;
    border-radius: 24px; padding: 30px 24px 24px; text-align: center;
    border: 6px solid #c8323c; box-shadow: 0 0 0 4px #f5c542, 0 24px 60px rgba(0,0,0,.5);
  }
  .day { font-family: 'Mountains of Christmas', Georgia, serif; color: #c8323c; font-size: 30px; margin: 0; }
  .emoji { font-size: 40px; line-height: 1.1; margin: 0; }
  .cardPic { height: 170px; margin: 6px auto 4px; background-repeat: no-repeat; background-position: center; -webkit-background-size: contain; background-size: contain; }
  .q { font-size: 23px; margin: 6px 0 18px; line-height: 1.3; }
  .a { font-size: 24px; color: #13573a; min-height: 30px; margin: 0 0 16px; visibility: hidden; opacity: 0; -webkit-transition: opacity .4s; transition: opacity .4s; }
  .a.show { visibility: visible; opacity: 1; }
  .btn {
    font-family: inherit; font-size: 20px; border: 0; cursor: pointer; -webkit-appearance: none;
    padding: 12px 26px; border-radius: 30px; background: #c8323c; color: #fff; box-shadow: 0 4px 0 #8f1d25;
  }
  .btn.alt { background: #1f7a4d; box-shadow: 0 4px 0 #13573a; }
  .close { position: absolute; top: 8px; right: 12px; background: none; border: 0; font-size: 32px; cursor: pointer; color: #8a6d5d; line-height: 1; -webkit-appearance: none; }

  .toast {
    position: fixed; left: 10px; right: 10px; bottom: 24px; z-index: 20; text-align: center;
    pointer-events: none; opacity: 0; -webkit-transition: opacity .3s; transition: opacity .3s;
  }
  .toast span { display: inline-block; font-size: 19px; line-height: 1.35; background: #f5c542; color: #3a2306; padding: 12px 22px; border-radius: 30px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .toast.show { opacity: 1; }
  .bit { position: fixed; z-index: 15; pointer-events: none; font-size: 26px; -webkit-transition: all 1s ease-out; transition: all 1s ease-out; }
  footer { text-align: center; margin-top: 20px; font-size: 15px; text-shadow: 0 1px 4px #000, 0 0 10px #000; }
</style>
</head>
<body>
<!-- Home button: goes back to the Kids' Hub -->
<a href="https://lachlanmcgillivray-spec.github.io/" aria-label="Back to Kids' Hub" style="position:fixed;top:10px;left:10px;z-index:9;display:block;padding:8px 14px;border-radius:22px;background:rgba(0,0,0,0.55);color:#fff;font:bold 18px/1.2 'Helvetica Neue',Helvetica,Arial,sans-serif;text-decoration:none;-webkit-box-shadow:0 2px 6px rgba(0,0,0,0.4);box-shadow:0 2px 6px rgba(0,0,0,0.4);">&#127968; Home</a>

<div id="bg"></div>
<canvas id="snow"></canvas>
<div class="wrap">
  <header>
    <h1>Christmas Joke<br>Advent Calendar</h1>
    <p class="sub">A new silly joke behind a door every day in December! 🎄</p>
    <div class="status" id="status"></div>
    <div id="resetWrap" style="display:none;margin-top:12px">
      <button class="btn" id="resetBtn" style="font-size:16px;padding:9px 20px">🔄 Close all doors &amp; leave preview</button>
    </div>
  </header>
  <div class="board" id="board"></div>
  <footer>Open one door each day. No peeking! 🎅<div id="past" style="margin-top:8px"></div></footer>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <button class="close" id="closeBtn" aria-label="Close">&times;</button>
    <p class="day" id="cDay"></p>
    <div class="cardPic" id="cPic"></div>
    <div class="emoji" id="cEmoji"></div>
    <p class="q" id="cQ"></p>
    <p class="a" id="cA"></p>
    <button class="btn" id="revealBtn">Tell me! 🤔</button>
  </div>
</div>
<div class="toast" id="toast"><span id="toastText"></span></div>

<!-- Each year's jokes live in its own file. Add a new line here for each new year. -->
<script>var ADVENT_YEARS = [];</script>
<script src="years/2026.js" charset="utf-8"></script>

<script>
/* Plain old JavaScript (ES5) so it runs on older iPads. */
(function () {
  // ---- Pick which year's jokes to show ----
  var now = new Date();
  var thisYear = now.getFullYear();
  var hash = window.location.hash.toLowerCase();
  var preview = hash === "#preview";
  var askYear = /^#year-(\d{4})$/.exec(hash);
  askYear = askYear ? parseInt(askYear[1], 10) : 0;

  var YEARS = window.ADVENT_YEARS || [];
  YEARS.sort(function (x, y) { return x.year - y.year; });
  function findYear(y) { for (var i = 0; i < YEARS.length; i++) if (YEARS[i].year === y) return YEARS[i]; return null; }
  // This year's set; if it hasn't been added yet, the newest earlier set.
  var current = findYear(thisYear);
  if (!current) for (var i = YEARS.length - 1; i >= 0; i--) if (YEARS[i].year <= thisYear) { current = YEARS[i]; break; }
  if (!current) current = YEARS[YEARS.length - 1];

  // #year-2026 shows another year's calendar with every door open (past years, or peeking at next year's)
  var archive = askYear && askYear !== thisYear && findYear(askYear) ? findYear(askYear) : null;
  var SET = archive || current;
  var JOKES = [];
  for (var j = 0; j < SET.jokes.length; j++) {
    var o = SET.jokes[j]; JOKES.push([o.emoji, o.q, o.a, o.pic]);
  }
  function santiUrl(d) { return JOKES[d - 1][3]; }
  if (SET.background) document.getElementById("bg").style.backgroundImage = "url(" + SET.background + ")";

  // Scrambled door order, like a real advent calendar
  var ORDER = [7,18,2,23,11,15,4,20,13,1,9,22,16,6,24,3,12,19,10,5,21,14,8,17];
  // Opened doors are remembered separately for each year, so a new year starts with every door closed.
  var KEY = "advent-jokes-opened-" + SET.year;
  try { window.localStorage.removeItem("advent-jokes-opened"); } catch (e) {}  // old, pre-yearly key

  // Adding or removing #preview on an open page doesn't reload it, so reload here.
  window.addEventListener("hashchange", function () { window.location.reload(); }, false);
  var isDec = now.getMonth() === 11;
  var today = isDec ? now.getDate() : 0;
  function canOpen(d) { return preview || !!archive || (isDec && d <= today); }

  var opened = {};
  try { opened = JSON.parse(window.localStorage.getItem(KEY) || "{}") || {}; } catch (e) {}
  function save() { try { window.localStorage.setItem(KEY, JSON.stringify(opened)); } catch (e) {} }

  function $(id) { return document.getElementById(id); }
  function addClass(el, c) { if ((" " + el.className + " ").indexOf(" " + c + " ") < 0) el.className += " " + c; }
  function removeClass(el, c) { el.className = (" " + el.className + " ").replace(" " + c + " ", " ").replace(/^\s+|\s+$/g, ""); }
  function hasClass(el, c) { return (" " + el.className + " ").indexOf(" " + c + " ") >= 0; }

  // Status line
  var status = $("status");
  if (archive) {
    status.innerHTML = "📖 Santi\u2019s " + archive.year + " jokes \u2014 every door is open!";
  } else if (preview) {
    status.innerHTML = "👀 Grown-up preview: every door is unlocked";
  } else if (isDec && today <= 24) {
    status.innerHTML = "🎁 Today is December " + today + " — open door " + today + "!";
  } else if (isDec) {
    status.innerHTML = "🎉 Merry Christmas! Every door is open — read them all again!";
  } else {
    var start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var dec1 = new Date(now.getFullYear(), 11, 1);
    var sleeps = Math.round((dec1 - start) / 86400000);
    status.innerHTML = "⏳ " + sleeps + " sleep" + (sleeps === 1 ? "" : "s") + " until the first door opens!";
  }

  // Grown-up reset: forget every opened door on this device, then go back to the normal calendar
  if (preview) {
    $("resetWrap").style.display = "block";
    $("resetBtn").onclick = function () {
      opened = {};
      try { window.localStorage.removeItem(KEY); } catch (e) {}
      window.location.hash = "";
      window.location.reload();
    };
  }

  // Links to past years' calendars (and back to this year's)
  var links = [];
  for (var y = 0; y < YEARS.length; y++) {
    var yr = YEARS[y].year;
    if (yr < thisYear && yr !== SET.year) links.push('<a style="color:#f5c542" href="#year-' + yr + '">' + yr + '</a>');
  }
  if (archive) links.push('<a style="color:#f5c542" href="#">Back to this year</a>');
  if (links.length) $("past").innerHTML = (archive ? "" : "Past calendars: ") + links.join(" \u00b7 ");

  // Build the doors
  var board = $("board");
  for (var i = 0; i < ORDER.length; i++) {
    (function (d, i) {
      var cell = document.createElement("div");
      cell.className = "cell";
      var b = document.createElement("button");
      b.className = "door c" + (i % 3);
      b.setAttribute("aria-label", "Door " + d);
      b.setAttribute("data-day", d);
      b.innerHTML = '<span class="inside">' + JOKES[d - 1][0] + '</span>' +
        '<span class="front"><span class="pic" style="background-image:url(' + santiUrl(d) + ')"></span>' +
        '<span class="num">' + d + '</span><span class="tag">' + (canOpen(d) ? "" : "🔒") + '</span></span>';
      if (!canOpen(d)) addClass(b, "locked");
      else if (opened[d]) addClass(b, "opened");
      if (!preview && !archive && isDec && d === today && !opened[d]) addClass(b, "today");
      b.onclick = function () { clickDoor(b, d); };
      cell.appendChild(b);
      board.appendChild(cell);
    })(ORDER[i], i);
  }

  var NOPE = ["Patience, little elf!", "No peeking!", "Santa is watching! 🎅", "Not yet, you cheeky reindeer!"];
  function clickDoor(el, d) {
    if (!canOpen(d)) {
      removeClass(el, "shake");
      void el.offsetWidth;
      addClass(el, "shake");
      var msg = NOPE[d % NOPE.length] + " That\u2019s door " + d + ". It opens on December " + d + ".";
      if (isDec && today <= 24) {
        msg = NOPE[d % NOPE.length] + " That\u2019s door " + d + ". Today\u2019s door is number " + today + " \u2014 look for the one that\u2019s glowing! \u2728";
        var t = document.querySelector('.door[data-day="' + today + '"]');
        if (t) { removeClass(t, "shake"); void t.offsetWidth; addClass(t, "shake"); }
      }
      toast(msg);
      return;
    }
    var wasOpen = hasClass(el, "opened");
    addClass(el, "opened");
    removeClass(el, "today");
    if (!preview && !archive) { opened[d] = true; save(); }  // preview peeks aren't remembered
    setTimeout(function () { showJoke(d); }, wasOpen ? 0 : 600);
  }

  var overlay = $("overlay"), cA = $("cA"), revealBtn = $("revealBtn");
  function showJoke(d) {
    var j = JOKES[d - 1];
    $("cDay").innerHTML = "December " + d;
    $("cEmoji").innerHTML = j[0];
    $("cPic").style.backgroundImage = "url(" + santiUrl(d) + ")";
    $("cQ").innerHTML = j[1];
    cA.innerHTML = j[2];
    removeClass(cA, "show");
    revealBtn.innerHTML = "Tell me! 🤔";
    revealBtn.className = "btn";
    addClass(overlay, "show");
  }
  function closeCard() { removeClass(overlay, "show"); }
  revealBtn.onclick = function () {
    if (!hasClass(cA, "show")) {
      addClass(cA, "show");
      revealBtn.innerHTML = "Ha ha ha! Close 🎄";
      revealBtn.className = "btn alt";
      burst(revealBtn);
    } else {
      closeCard();
    }
  };
  $("closeBtn").onclick = closeCard;
  overlay.onclick = function (e) { if (e.target === overlay) closeCard(); };
  document.onkeydown = function (e) { if (e.keyCode === 27) closeCard(); };

  function burst(el) {
    var r = el.getBoundingClientRect();
    var bits = ["⭐", "❄️", "🎁", "✨", "🎄", "🔔", "😂"];
    for (var k = 0; k < 16; k++) {
      (function (k) {
        var s = document.createElement("span");
        s.className = "bit";
        s.innerHTML = bits[k % bits.length];
        s.style.left = (r.left + r.width / 2) + "px";
        s.style.top = r.top + "px";
        document.body.appendChild(s);
        var ang = Math.random() * Math.PI * 2, dist = 80 + Math.random() * 120;
        var t = "translate(" + Math.round(Math.cos(ang) * dist) + "px," + Math.round(Math.sin(ang) * dist - 60) + "px) rotate(" + Math.round(Math.random() * 360 - 180) + "deg)";
        setTimeout(function () {
          s.style.webkitTransform = t; s.style.transform = t; s.style.opacity = "0";
        }, 20);
        setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 1200);
      })(k);
    }
  }

  var toastTimer;
  function toast(msg) {
    $("toastText").innerHTML = msg;
    addClass($("toast"), "show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { removeClass($("toast"), "show"); }, 4500);
  }

  // Falling snow
  var cv = $("snow"), ctx = cv.getContext && cv.getContext("2d");
  if (!ctx) return;
  var flakes = [];
  function size() {
    cv.width = window.innerWidth; cv.height = window.innerHeight;
    var n = Math.min(120, Math.floor(window.innerWidth / 8));
    flakes = [];
    for (var f = 0; f < n; f++) {
      flakes.push({ x: Math.random() * cv.width, y: Math.random() * cv.height,
        r: 1 + Math.random() * 3, s: 0.3 + Math.random() * 1.1, w: Math.random() * 6.28 });
    }
  }
  size();
  window.addEventListener("resize", size, false);
  var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame ||
    function (cb) { return setTimeout(cb, 33); };
  function tick() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    for (var f = 0; f < flakes.length; f++) {
      var p = flakes[f];
      p.y += p.s; p.w += 0.01; p.x += Math.sin(p.w) * 0.4;
      if (p.y > cv.height + 5) { p.y = -5; p.x = Math.random() * cv.width; }
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    raf(tick);
  }
  tick();
})();
</script>
</body>
</html>
